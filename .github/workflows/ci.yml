name: CI Pipeline

on:
  push:
    branches: [main, master, "001-*"]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint & Typecheck
        run: |
          npm run lint --if-present
          npm run build

      - name: Run Vitest Suite (Unit, Contract & Integration)
        run: npm test

      - name: Run Python Batch Pipeline Tests
        run: python -m unittest discover -s tests
